; FarmBot - ESP32 farming console
;
;   pio run -e esp32dev -t upload     dev grow times (default)
;   pio run -e esp32dev_real -t upload real grow times
;   pio run -e esp32dev_sim            Wokwi build: joins Wokwi-GUEST instead of the hotspot
;   pio test -e native                 PC unit tests for game.cpp and protocol.cpp

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.35.19
    madhephaestus/ESP32Encoder@^0.11.7
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.6.0
    bblanchon/ArduinoJson@^7.2.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
; Grow-time switch: add -D FARM_GROW_REAL=1 here, or use env:esp32dev_real.

[env:esp32dev_real]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D FARM_GROW_REAL=1

; Wokwi simulation: the simulated ESP32 can't host a hotspot a real laptop
; could join, so it joins Wokwi-GUEST and wokwi.toml forwards
; localhost:8180 to its port 80.
[env:esp32dev_sim]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D FARM_NET_SIM=1

; Host build: only the pure modules (game.cpp, protocol.cpp) plus the Unity tests.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<game.cpp> +<protocol.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -std=c++17
    -D FIXTURES_PATH=\"$PROJECT_DIR/tools/protocol_fixtures.json\"
    -Wall
    -Wextra
